<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101018">
<title>Aria — Free 3D AI Companion</title>
<style>
:root{--pink:#e0559b;--bg:#0f0f15;--panel:#191922;--line:#343441}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;background:radial-gradient(circle at 50% 5%,#30303c 0,#12121a 68%);touch-action:none}
canvas{display:block;width:100%;height:100%}
#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--pink);font-weight:700;font-size:16px;padding:16px;max-width:85%;pointer-events:none}
.topbar{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;pointer-events:none}
.badge,.settings{pointer-events:auto;background:#0009;border:1px solid #ffffff22;border-radius:999px;padding:9px 13px;color:#fff}
.settings{cursor:pointer;font-weight:700}
.chat{height:38%;min-height:230px;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -12px 30px #0008;z-index:5}
.log{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px;overscroll-behavior:contain}
.msg{max-width:min(82%,700px);padding:10px 14px;border-radius:16px;line-height:1.4;font-size:16px;word-break:break-word}
.user{align-self:flex-end;background:#2b2b37;border-bottom-right-radius:4px}
.aria{align-self:flex-start;background:var(--pink);border-bottom-left-radius:4px}
.controls{display:flex;gap:9px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0004}
#input{flex:1;min-width:0;border:1px solid #454552;background:#0d0d12;color:#fff;border-radius:28px;padding:13px 16px;font-size:17px;outline:none}
#input:focus{border-color:var(--pink)}
button{font:inherit}
#send{border:0;border-radius:28px;background:var(--pink);color:#fff;font-weight:800;padding:0 22px;min-width:88px}
#send:disabled{opacity:.45}
#settingsModal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.card{width:min(560px,100%);background:#1b1b25;border:1px solid #444;border-radius:20px;padding:20px;box-shadow:0 20px 60px #000}
.card h2{margin:0 0 8px}
.card p{color:#bbb;font-size:14px;line-height:1.4}
.card label{display:block;font-size:13px;color:#ccc;margin:14px 0 6px}
.card input{width:100%;padding:12px;border-radius:10px;border:1px solid #454552;background:#0d0d12;color:#fff}
.row{display:flex;gap:10px;margin-top:16px}
.row button{padding:11px 16px;border-radius:10px;border:0}
.primary{background:var(--pink);color:#fff;font-weight:800}.secondary{background:#33333f;color:#fff}
.danger{background:#5a202f;color:#fff}
.small{font-size:12px;color:#999;margin-top:10px}
@media (orientation:landscape) and (min-width:700px){
 .chat{height:44%;min-height:220px}.msg{font-size:15px}
}
@media (min-width:800px){
 .chat{height:36%}.controls{padding-left:24px;padding-right:24px}
 .log{padding-left:24px;padding-right:24px}
}
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.10/lib/three-vrm.module.js"
  }
}
</script>
</head>
<body>
<div id="stage">
  <div id="status">Loading Aria…</div>
  <div class="topbar">
    <div class="badge">ARIA</div>
    <button class="settings" id="settingsBtn">Settings</button>
  </div>
</div>

<section class="chat">
  <div class="log" id="log"></div>
  <form class="controls" id="form">
    <input id="input" autocomplete="off" placeholder="Talk to Aria…" enterkeyhint="send">
    <button id="send" type="submit">Send</button>
  </form>
</section>

<div id="settingsModal">
  <div class="card">
    <h2>Aria Settings</h2>
    <p>This build is designed to run free on GitHub Pages. Your API key is stored only in this browser's localStorage. For a public app, a server-side proxy is safer.</p>
    <label for="groqKey">Groq API key</label>
    <input id="groqKey" type="password" autocomplete="off" placeholder="gsk_…">
    <label for="language">Aria language</label>
    <select id="language" style="width:100%;padding:12px;border-radius:10px;border:1px solid #454552;background:#0d0d12;color:#fff;font-size:16px">
      <option value="en">English</option>
      <option value="hi">हिन्दी (Hindi)</option>
    </select>
    <label for="geminiKey">Gemini API key (optional backup)</label>
    <input id="geminiKey" type="password" autocomplete="off" placeholder="AIza…">
    <div class="row">
      <button class="primary" id="saveKeys">Save</button>
      <button class="secondary" id="closeSettings">Close</button>
      <button class="danger" id="clearMemory">Clear memory</button>
    </div>
    <div class="small">Free model target: Groq openai/gpt-oss-20b. Gemini is optional.</div>
  </div>
</div>

<script>
window.addEventListener("error",e=>{const s=document.getElementById("status");if(s)s.textContent="App error: "+(e.message||"unknown error")});
window.addEventListener("unhandledrejection",e=>{const s=document.getElementById("status");if(s)s.textContent="App error: "+((e.reason&&e.reason.message)||e.reason||"unknown error")});
</script>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {VRMLoaderPlugin,VRMUtils} from "@pixiv/three-vrm";

const $=id=>document.getElementById(id);
const stage=$("stage"), status=$("status"), log=$("log"), input=$("input"), send=$("send");
const get=(k,d="")=>{try{return localStorage.getItem(k)??d}catch{return d}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};

let GROQ_KEY=get("aria_groq");
let GEMINI_KEY=get("aria_gemini");
let LANGUAGE=get("aria_language","en");
$("language").value=LANGUAGE;
$("groqKey").value=GROQ_KEY;
$("geminiKey").value=GEMINI_KEY;

$("settingsBtn").onclick=()=>{$("settingsModal").style.display="flex"};
$("closeSettings").onclick=()=>{$("settingsModal").style.display="none"};
$("saveKeys").onclick=()=>{
  GROQ_KEY=$("groqKey").value.trim(); GEMINI_KEY=$("geminiKey").value.trim();
  LANGUAGE=$("language").value;
  set("aria_groq",GROQ_KEY); set("aria_gemini",GEMINI_KEY); set("aria_language",LANGUAGE);
  $("settingsModal").style.display="none";
  add(LANGUAGE==="hi" ? "सेटिंग्स सेव हो गईं।" : "Keys saved on this device.","aria");
};
$("clearMemory").onclick=()=>{
  if(confirm("Clear Aria's conversation memory on this device?")){
    localStorage.removeItem("aria_memory"); history=[]; log.innerHTML="";
    add("Memory cleared. Fresh start.","aria");
  }
};

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,.1,20);
camera.position.set(0,1.35,1.35);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
stage.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.enablePan=false; controls.minDistance=.8; controls.maxDistance=2.7;
controls.target.set(0,1.25,0); controls.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,.9));
const dl=new THREE.DirectionalLight(0xffffff,1.1); dl.position.set(1.5,2.5,1.5); scene.add(dl);

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  camera.aspect=w/Math.max(h,1); camera.updateProjectionMatrix(); renderer.setSize(w,h,false);
}
addEventListener("resize",resize); resize();

let vrm=null;
const loader=new GLTFLoader();
loader.register(parser=>new VRMLoaderPlugin(parser));

const AVATAR_LOCAL="./AliciaSolid_vrm-0.51.vrm";
const AVATAR_FALLBACK="https://cdn.jsdelivr.net/gh/vrm-c/UniVRM@master/Tests/Models/Alicia_vrm-0.51/AliciaSolid_vrm-0.51.vrm";

function loadAvatar(url,allowFallback){
  loader.load(url,g=>{
    vrm=g.userData.vrm;
    VRMUtils.removeUnnecessaryJoints(g.scene);
    if(vrm.meta?.metaVersion==="0") VRMUtils.rotateVRM0(vrm);
    scene.add(vrm.scene);
    status.style.display="none";
  },p=>{
    if(p.total) status.textContent="Loading Aria… "+Math.round(p.loaded/p.total*100)+"%";
  },err=>{
    console.warn("Avatar load failed",url,err);
    if(allowFallback) loadAvatar(AVATAR_FALLBACK,false);
    else status.textContent="Avatar failed. Upload AliciaSolid_vrm-0.51.vrm to the repo.";
  });
}
loadAvatar(AVATAR_LOCAL,true);

const clock=new THREE.Clock();
let speaking=false, lookX=0, lookY=0;
stage.addEventListener("pointermove",e=>{
  const r=stage.getBoundingClientRect();
  lookX=((e.clientX-r.left)/r.width)*2-1;
  lookY=-((e.clientY-r.top)/r.height)*2+1;
});

function animate(){
 requestAnimationFrame(animate);
 const dt=clock.getDelta(),t=clock.elapsedTime;
 if(vrm){
   const h=vrm.humanoid, em=vrm.expressionManager;
   const spine=h?.getNormalizedBoneNode("spine");
   if(spine) spine.rotation.x=Math.sin(t*.8)*.012;
   const la=h?.getNormalizedBoneNode("leftUpperArm"),ra=h?.getNormalizedBoneNode("rightUpperArm");
   // Alicia loads with raised arms. Apply a neutral arms-down pose.
   if(la) la.rotation.z=1.05;
   if(ra) ra.rotation.z=-1.05;
   const neck=h?.getNormalizedBoneNode("neck");
   if(neck){
     neck.rotation.y=THREE.MathUtils.lerp(neck.rotation.y,-lookX*.35,.06);
     neck.rotation.x=THREE.MathUtils.lerp(neck.rotation.x,lookY*.22,.06);
   }
   if(em){
     try{
       em.setValue("blink",Math.sin(t*2.7)>.97?1:0);
       ["aa","ih","ou","ee","oh"].forEach(x=>em.setValue(x,0));
       if(speaking) em.setValue(["aa","ih","ou","ee","oh"][Math.floor(t*14)%5],.7);
     }catch{}
   }
   vrm.update(dt);
 }
 controls.update(); renderer.render(scene,camera);
}
animate();

function systemPrompt(){
  const lang = LANGUAGE === "hi" ? "Hindi" : "English";
  return `You are Aria, a friendly 3D anime companion. Be natural, warm, playful and concise.
Reply in ${lang}. Use natural conversational ${lang}.
Reply in 1-3 short sentences. No markdown and no emojis.
At the end, append exactly one JSON object: {"emotion":"neutral|happy|angry|sad|surprised|shy"}
Do not put anything after that JSON object.`;
}

let history=[];
try{history=JSON.parse(get("aria_memory","[]"))||[]}catch{history=[]}
function trim(){
 if(history.length>24) history=history.slice(-24);
 while(history.length && history[0].role!=="user") history.shift();
}
function save(){trim();set("aria_memory",JSON.stringify(history))}
function add(text,who){
 const d=document.createElement("div"); d.className="msg "+who; d.textContent=text;
 log.appendChild(d); log.scrollTop=log.scrollHeight;
}
function render(){
 if(!history.length){
  add(LANGUAGE==="hi" ? "नमस्ते। मैं आरिया हूँ। Settings में जाकर AI key जोड़ें, फिर मुझसे बात करें।" : "Hi. I'm Aria. Tap Settings to connect a free AI key, then talk to me.","aria");
  return;
}
 for(const m of history){
   const text=m.role==="assistant"?clean(m.content).text:m.content;
   if(text)add(text,m.role==="user"?"user":"aria");
 }
}
function clean(raw){
 let emotion="neutral",text=String(raw||"").trim();
 const m=text.match(/\{[\s\S]*?"emotion"\s*:\s*"(neutral|happy|angry|sad|surprised|shy)"[\s\S]*?\}\s*$/i);
 if(m){emotion=m[1].toLowerCase();text=text.slice(0,m.index).trim()}
 text=text.replace(/^```(?:json)?|```$/g,"").trim();
 return {text:text||"...",emotion};
}
render();

let emotionTimer;
function emotion(name){
 if(!vrm?.expressionManager)return;
 const em=vrm.expressionManager;
 ["happy","angry","sad","relaxed","surprised"].forEach(x=>{try{em.setValue(x,0)}catch{}});
 clearTimeout(emotionTimer);
 const map={neutral:null,happy:"happy",angry:"angry",sad:"sad",surprised:"surprised",shy:"relaxed"};
 const x=map[name];
 if(x){try{em.setValue(x,1)}catch{} emotionTimer=setTimeout(()=>emotion("neutral"),4500)}
}
function speak(text,emo){
 emotion(emo);
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text),voices=speechSynthesis.getVoices();
 const preferred=LANGUAGE==="hi" ? ["hi-IN","hi"] : ["en-US","en-GB","en"];
 const v=voices.find(x=>preferred.includes(x.lang))||voices.find(x=>LANGUAGE==="hi"?/^hi/i.test(x.lang):/^en/i.test(x.lang));
 if(v)u.voice=v;
 u.lang=LANGUAGE==="hi" ? "hi-IN" : "en-US";
 u.rate=1.04;u.pitch=1.16;
 u.onstart=()=>speaking=true;
 u.onend=()=>speaking=false;
 u.onerror=()=>speaking=false;
 speechSynthesis.speak(u);
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function transient(status,msg){return [408,429,500,502,503,504].includes(status)||/rate|limit|overload|busy|timeout|temporar/i.test(msg||"")}

async function groq(){
 const model="openai/gpt-oss-20b";
 const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
   method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_KEY},
   body:JSON.stringify({model,temperature:.7,max_tokens:260,messages:[{role:"system",content:systemPrompt()},...history]})
 });
 const d=await r.json().catch(()=>({}));
 if(!r.ok){const e=new Error(d.error?.message||"Groq error "+r.status);e.status=r.status;e.transient=transient(r.status,e.message);throw e}
 return d.choices?.[0]?.message?.content?.trim();
}

async function gemini(){
 const model="gemini-3.8-flash";
 const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent",{
   method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":GEMINI_KEY},
   body:JSON.stringify({
     systemInstruction:{parts:[{text:systemPrompt()}]},
     contents:history.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),
     generationConfig:{temperature:.7,maxOutputTokens:500}
   })
 });
 const d=await r.json().catch(()=>({}));
 if(!r.ok){const e=new Error(d.error?.message||"Gemini error "+r.status);e.status=r.status;e.transient=transient(r.status,e.message)||/not found|unavailable/i.test(e.message);throw e}
 return d.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("").trim();
}

async function getReply(){
 if(!GROQ_KEY&&!GEMINI_KEY)throw new Error(LANGUAGE==="hi" ? "Settings खोलकर एक free Groq API key जोड़ें।" : "Open Settings and add a free Groq API key.");
 const providers=[];
 if(GROQ_KEY)providers.push(groq);
 if(GEMINI_KEY)providers.push(gemini);
 let last;
 for(const fn of providers){
   for(let attempt=0;attempt<2;attempt++){
     try{const x=await fn();if(x)return x;throw new Error("Empty AI reply")}
     catch(e){last=e;if(!e.transient)break;await sleep(1000*(attempt+1))}
   }
 }
 throw last||new Error("No AI provider configured");
}

let busy=false;
$("form").onsubmit=async e=>{
 e.preventDefault();const text=input.value.trim();
 if(!text||busy)return;
 input.value="";add(text,"user");
 busy=true;send.disabled=true;input.disabled=true;
 const old=send.textContent;send.textContent="…";
 history.push({role:"user",content:text});trim();
 try{
   const raw=await getReply(); if(!raw)throw new Error("Empty AI reply");
   const parsed=clean(raw);
   history.push({role:"assistant",content:raw});save();
   add(parsed.text,"aria");speak(parsed.text,parsed.emotion);
 }catch(err){
   console.error(err);
   history.pop();save();
   add("I couldn't connect right now. "+(err.message||"Please try again."),"aria");
 }finally{
   busy=false;send.disabled=false;input.disabled=false;send.textContent=old;input.focus();
 }
};
if("speechSynthesis" in window) speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
</script>
</body>
</html>
