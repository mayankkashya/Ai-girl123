<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aria - 3D AI Companion</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: #0f0f13; font-family: system-ui, sans-serif; color: white; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  #canvas-container { flex: 1; min-height: 0; position: relative; background: radial-gradient(circle at top, #2a2a35 0%, #0f0f13 80%); touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #e0559b; font-weight: bold; pointer-events: none; text-align: center; }
  #keyBtn { position: absolute; top: 10px; right: 10px; padding: 6px 12px; font-size: 12px; background: rgba(0,0,0,.5); border: 1px solid #444; }
